<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Life in Months - Interactive</title>
  <meta name="description" content="Enter your date of birth, to see your life in months. Based on the post by Tim Urban, from Wait by Why.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="months-favicon.png" sizes="32x32">
  <link rel="stylesheet" href="your-life.css">
</head>
<body data-unit="months">
  <div class="title-box">
    <h1 class="title">Your Life in <label for="unitbox" class="unitbox-label visuallyhidden">Months</label></h1>
    <select name="unitbox" class="unitbox" id="unitbox" required>
      <option value="years">Years</option>
      <option value="months" selected>Months</option>
      <option value="weeks">Weeks</option>
    </select>
  </div>
  <form class="dob" action="#">
    <p class="instruction"><span class="print-hide">Enter your </span>Date of Birth</p>
    <label for="month" class="visuallyhidden">Month</label>
    <select name="month" class="month" id="month" required>
      <option value="0">January</option>
      <option value="1">February</option>
      <option value="2">March</option>
      <option value="3">April</option>
      <option value="4">May</option>
      <option value="5">June</option>
      <option value="6">July</option>
      <option value="7">August</option>
      <option value="8">September</option>
      <option value="9">October</option>
      <option value="10">November</option>
      <option value="11">December</option>
    </select>
    <label for="day" class="visuallyhidden">Day</label>
    <input type="text" class="day" id="day" placeholder="31" pattern="\d{0,2}" required/>
    <label for="year" class="visuallyhidden">Year</label>
    <input type="text" class="year" id="year" placeholder="1999" pattern="\d{4}" required/>
  </form>
  <p class="life-expectancy print-hide">
    <label for="life-expectancy">Life expectancy</label>
    <input type="number" class="life-expectancy-input" id="life-expectancy" min="1" max="150" value="90"/> years
    <span class="sep">&middot;</span>
    <label for="lived-color">Lived months</label>
    <input type="color" class="lived-color-input" id="lived-color" value="#b8b8b8"/>
  </p>
  <ol class="chart months group" id="chart"></ol>
  <div class="credits">
    <p>Based on the <a href="http://waitbutwhy.com/2014/05/life-weeks.html">Your Life in Weeks</a> post by Tim Urban, from <a href="http://waitbutwhy.com/">Wait But Why</a>.</p>
    <p class="print-hide"><a href="https://github.com/bryanbraun/your-life">Original project</a> &middot; <a href="https://niklasdorsch.com/your-life/">My version</a></p>
    <p class="print-hide"><a href="javascript:window.print()">Print this page.</a></p>
  </div>
  <script src="your-life.js"></script>
</body>
</html>
